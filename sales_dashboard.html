    // ---------------------------------------------------------------------------

    const T = {

    const CATEGORY_COLORS = ["#5EEAD4", "#F5A524", "#818CF8", "#F2545B", "#4ADE80", "#EC4899"];

    // ---------------------------------------------------------------------------
    // Sample data generation
    // ---------------------------------------------------------------------------
    const PRODUCTS = [
      { name: "Aria Wireless Earbuds", category: "Audio", price: 89 },
      { name: "Pulse Fitness Band", category: "Wearables", price: 59 },
      { name: "Nimbus Backpack", category: "Accessories", price: 74 },
      { name: "Voltage Power Bank", category: "Electronics", price: 39 },
      { name: "Drift Bluetooth Speaker", category: "Audio", price: 65 },
      { name: "Orbit Smartwatch", category: "Wearables", price: 149 },
      { name: "Cascade Water Bottle", category: "Accessories", price: 22 },
      { name: "Flux Desk Lamp", category: "Home", price: 44 },
      { name: "Halo Ring Light", category: "Electronics", price: 33 },
      { name: "Strata Laptop Sleeve", category: "Accessories", price: 28 },
      { name: "Ember Travel Mug", category: "Home", price: 19 },
      { name: "Vector Mechanical Keyboard", category: "Electronics", price: 119 },
    ];
    const REGIONS = ["North America", "Europe", "APAC", "Latin America"];

    function generateSampleData() {
      const rows = [];
      const days = 180;
      const today = new Date();
      let id = 1;
      for (let d = days; d >= 0; d--) {
        const date = new Date(today);
        date.setDate(date.getDate() - d);
        const seasonal = 1 + 0.35 * Math.sin((d / 180) * Math.PI * 2.2) + (d < 14 ? 0.4 : 0);
        const txCount = Math.max(2, Math.round((6 + Math.random() * 10) * seasonal));
        for (let t = 0; t < txCount; t++) {
          const product = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)];
          const region = REGIONS[Math.floor(Math.random() * REGIONS.length)];
          const units = 1 + Math.floor(Math.random() * 5);
          const jitter = 0.85 + Math.random() * 0.3;
          const revenue = Math.round(product.price * units * jitter * 100) / 100;
          rows.push({
            id: id++,
            date: date.toISOString().slice(0, 10),
            product: product.name,
            category: product.category,
            region,
            units,
            revenue,
          });
        }
      }
      return rows;
    }

    // ---------------------------------------------------------------------------
    // Parsing helpers for imported files
    // ---------------------------------------------------------------------------
    function findKey(row, candidates) {
      const keys = Object.keys(row);
      for (const c of candidates) {
        const hit = keys.find((k) => k.toLowerCase().replace(/[^a-z0-9]/g, "").includes(c));
        if (hit) return hit;
      }
      return null;
    }

    function parseDateString(str) {
      if (!str) return null;
      let cleaned = String(str).trim();
      
      // Try standard JS Date parsing
      let d = new Date(cleaned);
      if (!isNaN(d)) return d;

      // Handle YYYYMMDD format
      if (/^\d{8}$/.test(cleaned)) {
        const y = parseInt(cleaned.slice(0, 4), 10);
        const m = parseInt(cleaned.slice(4, 6), 10);
        const day = parseInt(cleaned.slice(6, 8), 10);
        d = new Date(y, m - 1, day);
        if (!isNaN(d)) return d;
      }

      // Handle DD/MM/YYYY or DD-MM-YYYY or MM/DD/YYYY
      const parts = cleaned.split(/[-/.]/);
      if (parts.length === 3) {
        const p0 = parseInt(parts[0], 10);
        const p1 = parseInt(parts[1], 10);
        const p2 = parseInt(parts[2], 10);

        if (!isNaN(p0) && !isNaN(p1) && !isNaN(p2)) {
          // Case 1: YYYY-MM-DD or YYYY-DD-MM (year first)
          if (parts[0].length === 4) {
            if (p1 <= 12) {
              d = new Date(p0, p1 - 1, p2);
            } else {
              d = new Date(p0, p2 - 1, p1);
            }
            if (!isNaN(d)) return d;
          }
          
          // Case 2: DD/MM/YYYY or MM/DD/YYYY (year last)
          if (parts[2].length === 4 || parts[2].length === 2) {
            const year = parts[2].length === 2 ? (p2 < 70 ? 2000 + p2 : 1900 + p2) : p2;
            
            // If p0 is > 12, then p0 must be Day, p1 must be Month (DD/MM/YYYY)
            if (p0 > 12) {
              d = new Date(year, p1 - 1, p0);
              if (!isNaN(d)) return d;
            } 
            // If p1 is > 12, then p1 must be Day, p0 must be Month (MM/DD/YYYY)
            else if (p1 > 12) {
              d = new Date(year, p0 - 1, p1);
              if (!isNaN(d)) return d;
            } 
            // Otherwise, try MM/DD/YYYY or DD/MM/YYYY
            else {
              d = new Date(year, p0 - 1, p1);
              if (!isNaN(d)) return d;
            }
          }
        }
      }
      return null;
    }

    function normalizeRows(rawRows) {
      const clean = rawRows.filter((r) => r && Object.values(r).some((v) => v !== null && v !== "" && v !== undefined));
      if (clean.length === 0) return [];
      const sample = clean[0];
      
      const dateKey = findKey(sample, ["date", "orderdate", "transactiondate", "time", "timestamp", "createdat", "created"]);
      const productKey = findKey(sample, ["product", "item", "sku", "name", "title", "description"]);
      const categoryKey = findKey(sample, ["category", "categ", "type", "group", "class"]);
      const regionKey = findKey(sample, ["region", "location", "store", "market", "country", "state", "city", "zone"]);
      const unitsKey = findKey(sample, ["units", "qty", "quantity", "count", "number"]);
      const revenueKey = findKey(sample, ["revenue", "sales", "amount", "total", "price", "cost", "sum", "rev"]);
      const priceKey = findKey(sample, ["price", "unitprice", "rate", "cost"]);

      return clean.map((r, i) => {
        let date = dateKey ? r[dateKey] : null;
        if (date instanceof Date) {
          date = date.toISOString().slice(0, 10);
        } else if (typeof date === "number") {
          // Excel serial date
          const d = XLSX.SSF ? XLSX.SSF.parse_date_code(date) : null;
          date = d ? `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}` : String(date);
        } else if (date !== null && date !== undefined) {
          const parsed = parseDateString(date);
          date = parsed ? parsed.toISOString().slice(0, 10) : String(date);
        } else {
          date = "unknown";
        }
        
        const units = unitsKey ? Number(r[unitsKey]) || 1 : 1;
        let revenue = revenueKey ? Number(r[revenueKey]) : NaN;
        if (isNaN(revenue) && priceKey) revenue = Number(r[priceKey]) * units;
        if (isNaN(revenue)) revenue = 0;
        
        return {
          id: i + 1,
          date,
          product: productKey ? String(r[productKey]) : "Unknown product",
          category: categoryKey ? String(r[categoryKey]) : "Uncategorized",
          region: regionKey ? String(r[regionKey]) : "Unspecified",
          units,
          revenue: Math.round(revenue * 100) / 100,
        };
      });
    }

    // ---------------------------------------------------------------------------
    // Small UI primitives
    // ---------------------------------------------------------------------------
    function fmtCurrency(n) {
      if (Math.abs(n) >= 1000000) return "$" + (n / 1000000).toFixed(2) + "M";
      if (Math.abs(n) >= 1000) return "$" + (n / 1000).toFixed(1) + "K";
      return "$" + n.toFixed(0);
    }
    function fmtNumber(n) {
      if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(2) + "M";
      if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function Card({ children, style }) {
      return (
        <div style={{ background: T.panel, border: `1px solid ${T.border}`, borderRadius: 10, padding: 18, ...style }}>

    }

    function KPI({ icon: Icon, label, value, sub, subPositive }) {
      return (
        <Card style={{ display: "flex", flexDirection: "column", gap: 10, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style={{ fontFamily: T.sans, fontSize: 11, letterSpacing: "0.09em", textTransform: "uppercase", color: T.muted, fontWeight: 600 }}>
              {label}
            </span>
            <Icon size={15} color={T.faint} />
          </div>
          <div style={{ fontFamily: T.mono, fontSize: 26, fontWeight: 600, color: T.text, letterSpacing: "-0.02em", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {value}
          </div>
          {sub && (
            <div style={{ display: "flex", alignItems: "center", gap: 4, fontFamily: T.mono, fontSize: 12, color: subPositive ? T.positive : T.negative }}>
              {subPositive ? <TrendingUp size={12} /> : <TrendingDown size={12} />}
              {sub}
            </div>
          )}
        </Card>
      );
    }

    function Chip({ active, onClick, children }) {
      return (
        <button
          onClick={onClick}
          style={{
            fontFamily: T.sans, fontSize: 12.5, fontWeight: 500, cursor: "pointer",
            padding: "6px 12px", borderRadius: 7,
            border: `1px solid ${active ? T.accent : T.border}`,
            background: active ? T.accentDim : "transparent",
            color: active ? T.accent : T.muted,
            transition: "all 0.15s",
          }}
        >
          {children}
        </button>
      );
    }

    function CustomTooltip({ active, payload, label, currency }) {
      if (!active || !payload || !payload.length) return null;
      return (
        <div style={{ background: "#1A1F2B", border: `1px solid ${T.borderLight}`, borderRadius: 8, padding: "10px 13px", fontFamily: T.mono, fontSize: 12.5 }}>
          <div style={{ color: T.muted, marginBottom: 6, fontSize: 11 }}>{label}</div>
          {payload.map((p, i) => (
            <div key={i} style={{ color: p.color || T.text, display: "flex", justifyContent: "space-between", gap: 16 }}>
              <span>{p.name}</span>
              <span style={{ fontWeight: 600 }}>{currency ? fmtCurrency(p.value) : fmtNumber(p.value)}</span>
            </div>
          ))}
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // Main dashboard component
    // ---------------------------------------------------------------------------
    function SalesDashboard() {
      const [rows, setRows] = useState(() => generateSampleData());
      const [sourceLabel, setSourceLabel] = useState("Sample dataset · 180 days");
      const [importError, setImportError] = useState(null);
      const [loading, setLoading] = useState(false);
      const fileInputRef = useRef(null);

      const [category, setCategory] = useState("All");
      const [region, setRegion] = useState("All");
      const [search, setSearch] = useState("");
      const [granularity, setGranularity] = useState("Daily");
      const [range, setRange] = useState("90"); // days, or "all"

      const [sortKey, setSortKey] = useState("date");
      const [sortDir, setSortDir] = useState("desc");
      const [page, setPage] = useState(0);
      const pageSize = 8;

      const handleImportSuccess = useCallback((normalized, fileName) => {
        setRows(normalized);
        setSourceLabel(`${fileName} · ${normalized.length} rows`);
        setRange("all");      // Show all time so imported records aren't filtered out by the default 90D window
        setCategory("All");   // Reset other filters to ensure data is visible
        setRegion("All");
        setSearch("");
        setPage(0);
        setImportError(null);
      }, []);

      // ---- file import -------------------------------------------------------
      const handleFile = useCallback((file) => {
        if (!file) return;
        setLoading(true);
        setImportError(null);
        const ext = file.name.split(".").pop().toLowerCase();
        if (ext === "csv") {
          Papa.parse(file, {
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: (res) => {
              try {
                const normalized = normalizeRows(res.data);
                if (normalized.length === 0) throw new Error("No usable rows found");
                handleImportSuccess(normalized, file.name);
              } catch (e) {
                setImportError("Couldn't read that CSV. Check it has header columns like date, product, units, revenue.");
              }
              setLoading(false);
            },
            error: () => {
              setImportError("Failed to parse CSV file.");
              setLoading(false);
            },
          });
        } else if (ext === "xlsx" || ext === "xls") {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const wb = XLSX.read(e.target.result, { type: "array", cellDates: true });
              const sheet = wb.Sheets[wb.SheetNames[0]];
              const json = XLSX.utils.sheet_to_json(sheet, { defval: null });
              const normalized = normalizeRows(json);
              if (normalized.length === 0) throw new Error("empty");
              handleImportSuccess(normalized, file.name);
            } catch (err) {
              setImportError("Couldn't read that spreadsheet. Check it has header columns like date, product, units, revenue.");
            }
            setLoading(false);
          };
          reader.onerror = () => { setImportError("Failed to read file."); setLoading(false); };
          reader.readAsArrayBuffer(file);
        } else if (ext === "json") {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const json = JSON.parse(e.target.result);
              const normalized = normalizeRows(Array.isArray(json) ? json : json.rows || json.data || []);
              if (normalized.length === 0) throw new Error("empty");
              handleImportSuccess(normalized, file.name);
            } catch (err) {
              setImportError("Couldn't read that JSON export. Expecting an array of records.");
            }
            setLoading(false);
          };
          reader.readAsText(file);
        } else {
          setImportError("Unsupported file type. Use .csv, .xlsx, .xls, or .json (a database export).");
          setLoading(false);
        }
      }, [handleImportSuccess]);

      const categories = useMemo(() => ["All", ...Array.from(new Set(rows.map((r) => r.category))).sort()], [rows]);
      const regions = useMemo(() => ["All", ...Array.from(new Set(rows.map((r) => r.region))).sort()], [rows]);

      // ---- filtering -----------------------------------------------------------
      const filtered = useMemo(() => {
        let out = rows;
        if (category !== "All") out = out.filter((r) => r.category === category);
        if (region !== "All") out = out.filter((r) => r.region === region);
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          out = out.filter((r) => r.product.toLowerCase().includes(q));
        }
        if (range !== "all") {
          const cutoff = new Date();
          cutoff.setDate(cutoff.getDate() - Number(range));
          out = out.filter((r) => {
            const d = new Date(r.date);
            return !isNaN(d) && d >= cutoff;
          });
        }
        return out;
      }, [rows, category, region, search, range]);

      // ---- KPIs -----------------------------------------------------------------
      const kpis = useMemo(() => {
        const totalRevenue = filtered.reduce((s, r) => s + r.revenue, 0);
        const totalUnits = filtered.reduce((s, r) => s + r.units, 0);
        const orders = filtered.length;
        const avgOrder = orders ? totalRevenue / orders : 0;

        const byProduct = {};
        filtered.forEach((r) => { byProduct[r.product] = (byProduct[r.product] || 0) + r.revenue; });
        const topProduct = Object.entries(byProduct).sort((a, b) => b[1] - a[1])[0];

        // compare to previous equal-length window
        let prevRevenue = 0;
        if (range !== "all") {
          const days = Number(range);
          const cutoffStart = new Date(); cutoffStart.setDate(cutoffStart.getDate() - days * 2);
          const cutoffEnd = new Date(); cutoffEnd.setDate(cutoffEnd.getDate() - days);
          prevRevenue = rows
            .filter((r) => (category === "All" || r.category === category) && (region === "All" || r.region === region))
            .filter((r) => { const d = new Date(r.date); return !isNaN(d) && d >= cutoffStart && d < cutoffEnd; })
            .reduce((s, r) => s + r.revenue, 0);
        }
        const change = prevRevenue > 0 ? ((totalRevenue - prevRevenue) / prevRevenue) * 100 : null;

        return { totalRevenue, totalUnits, orders, avgOrder, topProduct, change };
      }, [filtered, rows, range, category, region]);

      // ---- chart data -------------------------------------------------------
      const trendData = useMemo(() => {
        const buckets = {};
        filtered.forEach((r) => {
          let key = r.date;
          if (granularity === "Monthly") key = r.date.slice(0, 7);
          else if (granularity === "Weekly") {
            const d = new Date(r.date);
            if (!isNaN(d)) {
              const onejan = new Date(d.getFullYear(), 0, 1);
              const week = Math.ceil(((d - onejan) / 86400000 + onejan.getDay() + 1) / 7);
              key = `${d.getFullYear()}-W${week}`;
            }
          }
          if (!buckets[key]) buckets[key] = { label: key, revenue: 0, units: 0 };
          buckets[key].revenue += r.revenue;
          buckets[key].units += r.units;
        });
        return Object.values(buckets).sort((a, b) => (a.label > b.label ? 1 : -1));
      }, [filtered, granularity]);

      const topProductsData = useMemo(() => {
        const byProduct = {};
        filtered.forEach((r) => { byProduct[r.product] = (byProduct[r.product] || 0) + r.revenue; });
        return Object.entries(byProduct)
          .map(([name, revenue]) => ({ name, revenue }))
          .sort((a, b) => b.revenue - a.revenue)
          .slice(0, 7);
      }, [filtered]);

      const categoryData = useMemo(() => {
        const byCat = {};
        filtered.forEach((r) => { byCat[r.category] = (byCat[r.category] || 0) + r.revenue; });
        return Object.entries(byCat).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
      }, [filtered]);

      // ---- table --------------------------------------------------------------
      const sortedRows = useMemo(() => {
        const out = [...filtered].sort((a, b) => {
          let av = a[sortKey], bv = b[sortKey];
          if (typeof av === "string") { av = av.toLowerCase(); bv = bv.toLowerCase(); }
          if (av < bv) return sortDir === "asc" ? -1 : 1;
          if (av > bv) return sortDir === "asc" ? 1 : -1;
          return 0;
        });
        return out;
      }, [filtered, sortKey, sortDir]);

      const pageCount = Math.max(1, Math.ceil(sortedRows.length / pageSize));
      const pageRows = sortedRows.slice(page * pageSize, page * pageSize + pageSize);

      const toggleSort = (key) => {
        if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
        else { setSortKey(key); setSortDir("desc"); }
        setPage(0);
      };

      const resetFilters = () => { setCategory("All"); setRegion("All"); setSearch(""); setRange("90"); setPage(0); };
      const loadSample = () => { setRows(generateSampleData()); setSourceLabel("Sample dataset · 180 days"); setImportError(null); };

      const th = (key, label, align = "left") => (
        <th
          onClick={() => toggleSort(key)}
          style={{
            textAlign: align, padding: "10px 14px", cursor: "pointer", userSelect: "none",
            fontFamily: T.sans, fontSize: 11, letterSpacing: "0.07em", textTransform: "uppercase",
            color: sortKey === key ? T.accent : T.muted, fontWeight: 600, whiteSpace: "nowrap",
          }}
        >
          <span style={{ display: "inline-flex", alignItems: "center", gap: 3, flexDirection: align === "right" ? "row-reverse" : "row" }}>
            {label}
            {sortKey === key && (sortDir === "asc" ? <ChevronUp size={12} /> : <ChevronDown size={12} />)}
          </span>
        </th>
      );

      return (
        <div style={{ background: T.bg, minHeight: "100%", padding: "20px", fontFamily: T.sans, color: T.text }}>
          <div style={{ maxWidth: 1180, margin: "0 auto", display: "flex", flexDirection: "column", gap: 18 }}>

            {/* ---------------- Header / signal strip ---------------- */}
            <Card style={{ padding: "18px 22px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 14 }}>
                <div>
                  <div style={{ fontFamily: T.sans, fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: T.accent, fontWeight: 700, marginBottom: 6 }}>
                    Sales Intelligence
                  </div>
                  <div style={{ fontFamily: T.sans, fontSize: 22, fontWeight: 700, letterSpacing: "-0.01em" }}>
                    Revenue Control
                  </div>
                  <div style={{ fontFamily: T.mono, fontSize: 12, color: T.faint, marginTop: 4 }}>
                    {sourceLabel}
                  </div>
                </div>

                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <button
                    onClick={loadSample}
                    title="Reload sample data"
                    style={{
                      display: "flex", alignItems: "center", gap: 6, padding: "9px 13px", borderRadius: 8,
                      border: `1px solid ${T.border}`, background: "transparent", color: T.muted,
                      fontFamily: T.sans, fontSize: 12.5, fontWeight: 500, cursor: "pointer",
                    }}
                  >
                    <RefreshCw size={14} /> Sample data
                  </button>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".csv,.xlsx,.xls,.json"
                    style={{ display: "none" }}
                    onChange={(e) => handleFile(e.target.files[0])}
                  />
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    style={{
                      display: "flex", alignItems: "center", gap: 7, padding: "9px 15px", borderRadius: 8,
                      border: `1px solid ${T.accent}`, background: T.accentDim, color: T.accent,
                      fontFamily: T.sans, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                    }}
                  >
                    <Upload size={14} /> {loading ? "Importing…" : "Import CSV / Excel"}
                  </button>
                </div>
              </div>

              {importError && (
                <div style={{ marginTop: 12, padding: "9px 13px", borderRadius: 7, background: "#3D1F22", border: `1px solid ${T.negative}`, color: "#FCA5A5", fontSize: 12.5, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span>{importError}</span>
                  <X size={14} style={{ cursor: "pointer" }} onClick={() => setImportError(null)} />
                </div>
              )}

              <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${T.border}`, display: "flex", gap: 32, flexWrap: "wrap", fontFamily: T.mono }}>
                <div>
                  <div style={{ fontSize: 10, color: T.faint, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 3 }}>Revenue</div>
                  <div style={{ fontSize: 21, fontWeight: 600, color: T.accent }}>{fmtCurrency(kpis.totalRevenue)}</div>
                </div>
                <div>
                  <div style={{ fontSize: 10, color: T.faint, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 3 }}>Units</div>
                  <div style={{ fontSize: 21, fontWeight: 600 }}>{fmtNumber(kpis.totalUnits)}</div>
                </div>
                <div>
                  <div style={{ fontSize: 10, color: T.faint, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 3 }}>Orders</div>
                  <div style={{ fontSize: 21, fontWeight: 600 }}>{fmtNumber(kpis.orders)}</div>
                </div>
                <div>
                  <div style={{ fontSize: 10, color: T.faint, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 3 }}>SKUs active</div>
                  <div style={{ fontSize: 21, fontWeight: 600 }}>{new Set(filtered.map((r) => r.product)).size}</div>
                </div>
              </div>
            </Card>

            {/* ---------------- Filters ---------------- */}
            <Card style={{ padding: "14px 18px" }}>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 7, background: T.panel2, border: `1px solid ${T.border}`, borderRadius: 8, padding: "7px 11px", flex: "1 1 200px" }}>
                  <Search size={14} color={T.faint} />
                  <input
                    value={search}
                    onChange={(e) => { setSearch(e.target.value); setPage(0); }}
                    placeholder="Search product…"
                    style={{ background: "transparent", border: "none", outline: "none", color: T.text, fontFamily: T.sans, fontSize: 13, width: "100%" }}
                  />
                </div>

                <select value={category} onChange={(e) => { setCategory(e.target.value); setPage(0); }} style={selectStyle}>
                  {categories.map((c) => <option key={c} value={c}>{c === "All" ? "All categories" : c}</option>)}
                </select>

                <select value={region} onChange={(e) => { setRegion(e.target.value); setPage(0); }} style={selectStyle}>
                  {regions.map((r) => <option key={r} value={r}>{r === "All" ? "All regions" : r}</option>)}
                </select>

                <div style={{ display: "flex", gap: 6 }}>
                  {[["30", "30D"], ["90", "90D"], ["180", "180D"], ["all", "All time"]].map(([v, l]) => (
                    <Chip key={v} active={range === v} onClick={() => setRange(v)}>{l}</Chip>
                  ))}
                </div>

                {(category !== "All" || region !== "All" || search || range !== "90") && (
                  <button onClick={resetFilters} style={{ marginLeft: "auto", background: "transparent", border: "none", color: T.faint, fontSize: 12, cursor: "pointer", fontFamily: T.sans, display: "flex", alignItems: "center", gap: 4 }}>
                    <X size={13} /> Clear filters
                  </button>
                )}
              </div>
            </Card>

            {/* ---------------- KPI cards ---------------- */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: 14 }}>
              <KPI icon={DollarSign} label="Total Revenue" value={fmtCurrency(kpis.totalRevenue)}
                sub={kpis.change !== null ? `${kpis.change >= 0 ? "+" : ""}${kpis.change.toFixed(1)}% vs prior period` : null}
                subPositive={kpis.change >= 0} />
              <KPI icon={ShoppingCart} label="Units Sold" value={fmtNumber(kpis.totalUnits)} />
              <KPI icon={Package} label="Avg Order Value" value={fmtCurrency(kpis.avgOrder)} />
              <KPI icon={TrendingUp} label="Top Product" value={kpis.topProduct ? kpis.topProduct[0] : "—"}
                sub={kpis.topProduct ? fmtCurrency(kpis.topProduct[1]) + " revenue" : null} subPositive={true} />
            </div>

            {/* ---------------- Revenue trend ---------------- */}
            <Card>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
                <div style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600 }}>Revenue Trend</div>
                <div style={{ display: "flex", gap: 6 }}>
                  {["Daily", "Weekly", "Monthly"].map((g) => (
                    <Chip key={g} active={granularity === g} onClick={() => setGranularity(g)}>{g}</Chip>
                  ))}
                </div>
              </div>
              <ResponsiveContainer width="100%" height={260}>
                <AreaChart data={trendData} margin={{ top: 5, right: 10, left: -10, bottom: 0 }}>
                  <defs>
                    <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor={T.accent} stopOpacity={0.35} />
                      <stop offset="100%" stopColor={T.accent} stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid stroke={T.border} strokeDasharray="3 3" vertical={false} />
                  <XAxis dataKey="label" tick={{ fill: T.faint, fontSize: 11, fontFamily: T.mono }} axisLine={{ stroke: T.border }} tickLine={false} minTickGap={30} />
                  <YAxis tick={{ fill: T.faint, fontSize: 11, fontFamily: T.mono }} axisLine={false} tickLine={false} tickFormatter={fmtCurrency} width={54} />
                  <Tooltip content={<CustomTooltip currency />} />
                  <Area type="monotone" dataKey="revenue" name="Revenue" stroke={T.accent} strokeWidth={2} fill="url(#revGrad)" />
                </AreaChart>
              </ResponsiveContainer>
            </Card>

            {/* ---------------- Top products + category split ---------------- */}
            <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 14, alignItems: "stretch" }}>
              <Card>
                <div style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, marginBottom: 14 }}>Top Products by Revenue</div>
                <ResponsiveContainer width="100%" height={260}>
                  <BarChart data={topProductsData} layout="vertical" margin={{ top: 0, right: 20, left: 0, bottom: 0 }}>
                    <CartesianGrid stroke={T.border} strokeDasharray="3 3" horizontal={false} />
                    <XAxis type="number" tick={{ fill: T.faint, fontSize: 11, fontFamily: T.mono }} axisLine={false} tickLine={false} tickFormatter={fmtCurrency} />
                    <YAxis type="category" dataKey="name" tick={{ fill: T.muted, fontSize: 11.5, fontFamily: T.sans }} axisLine={false} tickLine={false} width={140} />
                    <Tooltip content={<CustomTooltip currency />} cursor={{ fill: "rgba(255,255,255,0.03)" }} />
                    <Bar dataKey="revenue" name="Revenue" fill={T.accent} radius={[0, 4, 4, 0]} barSize={16} />
                  </BarChart>
                </ResponsiveContainer>
              </Card>

              <Card>
                <div style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, marginBottom: 6 }}>Revenue by Category</div>
                <ResponsiveContainer width="100%" height={230}>
                  <PieChart>
                    <Pie data={categoryData} dataKey="value" nameKey="name" innerRadius={55} outerRadius={85} paddingAngle={2}>
                      {categoryData.map((entry, i) => <Cell key={entry.name} fill={CATEGORY_COLORS[i % CATEGORY_COLORS.length]} stroke={T.panel} strokeWidth={2} />)}
                    </Pie>
                    <Tooltip content={<CustomTooltip currency />} />
                  </PieChart>
                </ResponsiveContainer>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 14px", justifyContent: "center", marginTop: 4 }}>
                  {categoryData.map((c, i) => (
                    <div key={c.name} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: T.muted, fontFamily: T.sans }}>
                      <span style={{ width: 8, height: 8, borderRadius: 2, background: CATEGORY_COLORS[i % CATEGORY_COLORS.length] }} />
                      {c.name}
                    </div>
                  ))}
                </div>
              </Card>
            </div>

            {/* ---------------- Transaction table ---------------- */}
            <Card style={{ padding: 0, overflow: "hidden" }}>
              <div style={{ padding: "16px 18px 10px", fontFamily: T.sans, fontSize: 14, fontWeight: 600 }}>
                Transactions <span style={{ color: T.faint, fontWeight: 400, fontSize: 12.5 }}>({sortedRows.length})</span>
              </div>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ borderTop: `1px solid ${T.border}`, borderBottom: `1px solid ${T.border}` }}>
                      {th("date", "Date")}
                      {th("product", "Product")}
                      {th("category", "Category")}
                      {th("region", "Region")}
                      {th("units", "Units", "right")}
                      {th("revenue", "Revenue", "right")}
                    </tr>
                  </thead>
                  <tbody>
                    {pageRows.map((r, i) => (
                      <tr key={r.id} style={{ borderBottom: `1px solid ${T.border}`, background: i % 2 === 0 ? "transparent" : "rgba(255,255,255,0.012)" }}>
                        <td style={tdStyle}>{r.date}</td>
                        <td style={{ ...tdStyle, color: T.text, fontWeight: 500 }}>{r.product}</td>
                        <td style={tdStyle}><span style={{ padding: "2px 8px", borderRadius: 5, background: T.panel2, fontSize: 11.5 }}>{r.category}</span></td>
                        <td style={tdStyle}>{r.region}</td>
                        <td style={{ ...tdStyle, textAlign: "right", fontFamily: T.mono }}>{r.units}</td>
                        <td style={{ ...tdStyle, textAlign: "right", fontFamily: T.mono, color: T.accent, fontWeight: 600 }}>{fmtCurrency(r.revenue)}</td>
                      </tr>
                    ))}
                    {pageRows.length === 0 && (
                      <tr><td colSpan={6} style={{ ...tdStyle, textAlign: "center", padding: 30, color: T.faint }}>No transactions match these filters.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 18px", fontFamily: T.mono, fontSize: 12, color: T.faint }}>
                <span>Page {page + 1} of {pageCount}</span>
                <div style={{ display: "flex", gap: 6 }}>
                  <button disabled={page === 0} onClick={() => setPage((p) => Math.max(0, p - 1))} style={pagerBtn(page === 0)}>Prev</button>
                  <button disabled={page >= pageCount - 1} onClick={() => setPage((p) => Math.min(pageCount - 1, p + 1))} style={pagerBtn(page >= pageCount - 1)}>Next</button>
                </div>
              </div>
            </Card>

            <div style={{ textAlign: "center", fontFamily: T.mono, fontSize: 11, color: T.faint, padding: "6px 0 14px" }}>
              Import maps common column names automatically (date, product, category, region, units/qty, revenue/sales/amount, price).
            </div>
          </div>
        </div>
      );
    }

    const selectStyle = {
      background: T.panel2, border: `1px solid ${T.border}`, borderRadius: 8, color: T.text,
      fontFamily: T.sans, fontSize: 12.5, padding: "8px 10px", outline: "none", cursor: "pointer",
    };
    const tdStyle = { padding: "10px 14px", fontSize: 12.5, color: T.muted, fontFamily: T.sans, whiteSpace: "nowrap" };
    const pagerBtn = (disabled) => ({
      padding: "5px 11px", borderRadius: 6, border: `1px solid ${T.border}`,
      background: "transparent", color: disabled ? T.faint : T.text,
      cursor: disabled ? "default" : "pointer", fontFamily: T.mono, fontSize: 11.5, opacity: disabled ? 0.5 : 1,
    });

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SalesDashboard />);
  </script>
</body>
</html>
